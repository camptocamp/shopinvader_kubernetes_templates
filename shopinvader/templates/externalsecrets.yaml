---
apiVersion: external-secrets.io/v1beta1
kind: ExternalSecret
metadata:
  name: shopinvader-storage
spec:
  refreshInterval: 1h
  secretStoreRef:
    kind: SecretStore
    name: shopinvader
  target:
    name: shopinvader-storage-secret
    creationPolicy: Owner
  data:
    - secretKey: accesskey
      remoteRef:
        key: storage_account_private_key
    - secretKey: storageaccountname
      remoteRef:
        key: storage_account_name
---
apiVersion: external-secrets.io/v1beta1
kind: ExternalSecret
metadata:
  name: shopinvader
spec:
  refreshInterval: 1h
  secretStoreRef:
    kind: SecretStore
    name: shopinvader
  target:
    name: shopinvader-app-secret
    creationPolicy: Owner
  data:
    - secretKey: ALLOWED-HOSTS-REGEX
      remoteRef:
        key: ALLOWED-HOSTS-REGEX
    - secretKey: DRAGON-FLY-SECRET
      remoteRef:
        key: DRAGON-FLY-SECRET
    - secretKey: MONGODB-URI
      remoteRef:
        key: MONGODB-URI
    - secretKey: S3-KEY-ID
      remoteRef:
        key: root-user
    - secretKey: S3-SECRET-KEY
      remoteRef:
        key: root-password
    - secretKey: S3-ENDPOINT
      remoteRef:
        key: S3-ENDPOINT
    - secretKey: S3-PATH-STYLE
      remoteRef:
        key: S3-PATH-STYLE
    - secretKey: S3-BUCKET
      remoteRef:
        key: S3-BUCKET
    - secretKey: S3-ASSET-HOST-URL
      remoteRef:
        key: S3-ASSET-HOST-URL
    - secretKey: S3-COSANUM-RO-KEY-ID
      remoteRef:
        key: S3-COSANUM-RO-KEY-ID
    - secretKey: S3-COSANUM-RO-KEY-SECRET
      remoteRef:
        key: S3-COSANUM-RO-KEY-SECRET
    - secretKey: SECRET-KEY-BASE
      remoteRef:
        key: SECRET-KEY-BASE
    - secretKey: SMTP-USERNAME
      remoteRef:
        key: SMTP-USERNAME
    - secretKey: SMTP-PASSWORD
      remoteRef:
        key: SMTP-PASSWORD
    - secretKey: SMTP-PORT
      remoteRef:
        key: SMTP-PORT
    - secretKey: SMTP-SENDER
      remoteRef:
        key: SMTP-SENDER
    - secretKey: SMTP-HELO-DOMAIN
      remoteRef:
        key: SMTP-HELO-DOMAIN
    - secretKey: SMTP-AUTHENTICATION
      remoteRef:
        key: SMTP-AUTHENTICATION
    - secretKey: SMTP-ENABLE-STARTTLS-AUTO
      remoteRef:
        key: SMTP-ENABLE-STARTTLS-AUTO
    - secretKey: SMTP-USERNAME
      remoteRef:
        key: SMTP-USERNAME
    - secretKey: SMTP-PASSWORD
      remoteRef:
        key: SMTP-PASSWORD
    - secretKey: LOCOMOTIVE-ENABLE-REGISTRATION
      remoteRef:
        key: LOCOMOTIVE-ENABLE-REGISTRATION

---
apiVersion: external-secrets.io/v1beta1
kind: ExternalSecret
metadata:
  name: redis
spec:
  refreshInterval: 1h
  secretStoreRef:
    kind: SecretStore
    name: celebrimbor
  target:
    name: redis
    creationPolicy: Owner
  data:
    - secretKey: SESSION_REDIS_URL
      remoteRef:
        key: SESSION-REDIS-URL
---
apiVersion: external-secrets.io/v1beta1
kind: ExternalSecret
metadata:
  name: storage
spec:
  refreshInterval: 1h
  secretStoreRef:
    kind: SecretStore
    name: celebrimbor
  target:
    name: storage
    creationPolicy: Owner
  data:
    - secretKey: AZURE_ACCOUNT_URL
      remoteRef:
        key: AZURE-ACCOUNT-URL
    - secretKey: AZURE_STORAGE_NAME
      remoteRef:
        key: AZURE-STORAGE-NAME
    - secretKey: AZURE_ANON_STORAGE_NAME
      remoteRef:
        key: AZURE-ANON-STORAGE-NAME
    - secretKey: AZURE_SUBSCRIPTION_ID
      remoteRef:
        key: AZURE-SUBSCRIPTION-ID
{{- with .Values.celebrimbor.additionalSecrets }}
---
apiVersion: external-secrets.io/v1beta1
kind: ExternalSecret
metadata:
  name: additional-secrets
spec:
  refreshInterval: 1h
  secretStoreRef:
    kind: SecretStore
    name: celebrimbor
  target:
    name: additional-secrets
    creationPolicy: Owner
  data:
    {{- range . }}
    - secretKey: {{ . }}
      remoteRef:
        key: {{ . | replace "_" "-" }}
    {{- end }}
{{- end }}
{{- if .Values.celebrimbor.key_backup.enabled }}
---
apiVersion: external-secrets.io/v1beta1
kind: ExternalSecret
metadata:
  name: keybackup
spec:
  refreshInterval: 1h
  secretStoreRef:
    kind: SecretStore
    name: celebrimbor
  target:
    name: keybackup
    creationPolicy: Owner
  data:
    - secretKey: LPASS_LOGIN
      remoteRef:
        key: KEYBACKUP-LPASS-LOGIN
    - secretKey: LPASS_PASSWORD
      remoteRef:
        key: KEYBACKUP-LPASS-PASSWORD
{{- end }}
